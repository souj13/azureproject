# This is a Declarative Automation Bundle definition for spotify_dab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: spotify_dab

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true

    workspace:
      host: https://*****.azuredatabricks.net
      root_path: /Workspace/Users/abc@xyz.com/.bundle/${bundle.name}/${bundle.target}

    presets:
      source_linked_deployment: false

  prod:
    mode: production

    workspace:
      host: https://*****.azuredatabricks.net
      root_path: /Workspace/Users/***/.bundle/${bundle.name}/${bundle.target}

    permissions:
      - user_name: abc@xyz.com
        level: CAN_MANAGE